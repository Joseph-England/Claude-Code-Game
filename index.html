<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mountain</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M0 15 L6 4 L9 9 L11 6 L16 15Z%27 fill=%27%23e88a9a%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="weight-vignette"></div>
    <div id="line"></div>
    <div id="toast"></div>
    <div id="wind">≈ gust ≈</div>
    <div id="prompt"></div>
    <div id="hint"></div>
    <div id="controls"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · mouse look · <kbd>Shift</kbd> sprint · <kbd>Space</kbd> jump · <kbd>R</kbd> back to the last cairn</div>
    <div id="fade"></div>
    <div id="title">
      <div class="inner">
        <h1>Mountain</h1>
        <p class="sub">a short climb at sunset</p>
        <p id="status">generating the mountain …</p>
      </div>
    </div>
    <div id="credits">
      <div class="roll">
        <h2>Mountain</h2>
        <p>Thanks for playing.</p>
        <p class="small back">refresh page to begin again</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
